<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Toddler Meals</title>
    <meta
      name="description"
      content="Today&rsquo;s breakfast, snacks, lunch and dinner. No decisions required."
    />

    <!-- Browser chrome follows the app, in both schemes. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf6ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15110d" />

    <!-- iOS ignores the manifest for these. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meals" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
